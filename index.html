<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Healthy Longevity — Journal</title>
<meta name="description" content="Studienlage, Messwerte und Schritte für einen normalen Alltag — das MHL Journal.">
<link rel="icon" href="design-system/assets/favicon-koralle.png">
<link rel="stylesheet" href="design-system/styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="design-system/_ds_bundle.js"></script>
<style>
body{margin:0;background:var(--surface-page);font-family:var(--font-body);color:var(--text-body)}
a{color:var(--text-accent);text-decoration:none}
a:hover{color:var(--action-accent-hover)}
.container{max-width:var(--container);margin:0 auto;padding:0 var(--gutter)}
.skip-link{position:absolute;left:-9999px;top:0;background:var(--tinte);color:var(--papier);padding:var(--space-3) var(--space-5);z-index:100;text-decoration:none;font-family:var(--font-brand);font-size:var(--text-kicker);letter-spacing:var(--track-kicker);text-transform:uppercase}
.skip-link:focus{left:var(--gutter);top:var(--space-3)}
.icon-btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:var(--radius-sm);color:var(--text-heading);cursor:pointer}
.icon-btn:hover{background:var(--surface-muted)}
.icon-btn:focus-visible{box-shadow:var(--ring-focus)}
.menu-subscribe{display:none!important}
@media (max-width:860px){
  .hero-grid,.hero-split,.magazine-grid,.value-grid,.guide-columns,.topic-split,.topic-grid-2,.topic-numbered{grid-template-columns:1fr!important}
  .metric-grid{grid-template-columns:repeat(2,1fr)!important}
}
@media (max-width:520px){.metric-grid{grid-template-columns:1fr!important}}
@media (max-width:640px){
  .article-row{grid-template-columns:1fr!important;gap:var(--space-2)!important}
  .article-row>div:last-child{justify-content:flex-start!important}
  .newsletter-grid{grid-template-columns:1fr!important}
  .newsletter-grid form{flex-wrap:wrap!important}
  .newsletter-grid input{min-width:0}
  .masthead-date{display:none}
}
@media (max-width:480px){
  .header-subscribe{display:none!important}
  .menu-subscribe{display:flex!important}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="js/shared.jsx"></script>
<script type="text/babel" src="js/topics.jsx"></script>
<script type="text/babel" src="js/magazine.jsx"></script>
<script type="text/babel">
const {Masthead,Footer}=window.MHLKit;
function App(){
  return <>
    <a className="skip-link" href="#main">Zum Inhalt springen</a>
    <Masthead active="Journal"/>
    <Magazine/>
    <Footer/>
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
